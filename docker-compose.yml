services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ai_workspace_db
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_DB: ai_workspace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ai_workspace']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
